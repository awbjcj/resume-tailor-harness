<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="resume-lifecycle-title resume-lifecycle-desc">
      <title id="resume-lifecycle-title">Fact-locked resume lifecycle</title>
      <desc id="resume-lifecycle-desc">Six-stage workflow from verified career evidence and job intake through extraction, human approval, fact-locked drafting, document rendering, and application tracking.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="960" height="600" fill="#f5f5f5"/>

      <text x="40" y="120" fill="#7a8399" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.12em">EVIDENCE-FIRST PIPELINE</text>
      <text x="40" y="148" fill="#2d3142" font-family="'Instrument Serif', serif" font-size="24">Models propose. People approve. Deterministic gates decide what is saved.</text>

      <!-- Connectors: drawn before nodes -->
      <line x1="152" y1="264" x2="184" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="296" y1="264" x2="328" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="440" y1="264" x2="472" y2="264" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="584" y1="264" x2="616" y2="264" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="728" y1="264" x2="760" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Nodes -->
      <rect x="40" y="208" width="112" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="208" width="112" height="112" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="216" width="40" height="16" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="68" y="228" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">INPUT</text>
      <text x="96" y="252" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Career evidence</text>
      <text x="96" y="276" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">facts.json</text>
      <text x="96" y="296" fill="#7a8399" font-family="'Geist', sans-serif" font-size="8" text-anchor="middle">verified fact IDs</text>

      <rect x="184" y="208" width="112" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="184" y="208" width="112" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="192" y="216" width="48" height="16" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="216" y="228" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">INGEST</text>
      <text x="240" y="252" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Job intake</text>
      <text x="240" y="276" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">pull · URL · file</text>
      <text x="240" y="296" fill="#7a8399" font-family="'Geist', sans-serif" font-size="8" text-anchor="middle">dedupe + upgrade</text>

      <rect x="328" y="208" width="112" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="328" y="208" width="112" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="336" y="216" width="48" height="16" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="360" y="228" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">SCORE</text>
      <text x="384" y="252" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Extract &amp; score</text>
      <text x="384" y="276" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">criteria · filters</text>
      <text x="384" y="296" fill="#7a8399" font-family="'Geist', sans-serif" font-size="8" text-anchor="middle">fit rationale</text>

      <rect x="472" y="208" width="112" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="472" y="208" width="112" height="112" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="480" y="216" width="48" height="16" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="504" y="228" fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">HUMAN</text>
      <text x="528" y="252" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Approve target</text>
      <text x="528" y="276" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">web · approve</text>
      <text x="528" y="296" fill="#7a8399" font-family="'Geist', sans-serif" font-size="8" text-anchor="middle">spend decision</text>

      <rect x="616" y="208" width="112" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="616" y="208" width="112" height="112" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="624" y="216" width="40" height="16" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="644" y="228" fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">GATE</text>
      <text x="672" y="252" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Draft &amp; verify</text>
      <text x="672" y="276" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">writer · review</text>
      <text x="672" y="296" fill="#7a8399" font-family="'Geist', sans-serif" font-size="8" text-anchor="middle">3 deterministic gates</text>

      <rect x="760" y="208" width="112" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="208" width="112" height="112" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="768" y="216" width="56" height="16" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="796" y="228" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">DELIVER</text>
      <text x="816" y="252" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Render &amp; track</text>
      <text x="816" y="276" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">Typst · PDF</text>
      <text x="816" y="296" fill="#7a8399" font-family="'Geist', sans-serif" font-size="8" text-anchor="middle">application timeline</text>

      <!-- Outcome strip -->
      <path d="M 816,320 V 368 Q 816,376 808,376 H 528 Q 520,376 520,384 V 404" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
      <rect x="640" y="352" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="676" y="360" fill="#7a8399" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">USER REVIEW</text>
      <rect x="424" y="404" width="192" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="424" y="404" width="192" height="56" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <text x="520" y="428" fill="#2d3142" font-family="'Geist', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Ready for a human decision</text>
      <text x="520" y="448" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">submit · revise · close</text>

      <!-- Legend -->
      <line x1="40" y1="504" x2="920" y2="504" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
      <text x="40" y="528" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.12em">LEGEND</text>
      <rect x="128" y="516" width="16" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="152" y="528" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="8">automated stage</text>
      <rect x="280" y="516" width="16" height="16" rx="4" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="304" y="528" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="8">approval or enforcement</text>
      <rect x="480" y="516" width="16" height="16" rx="4" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="504" y="528" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="8">durable artifact</text>
      <line x1="640" y1="524" x2="672" y2="524" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
      <text x="684" y="528" fill="#4f5d75" font-family="'Geist', sans-serif" font-size="8">review handoff</text>
    </svg>
