<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="agent-workflow.zh-CN-title agent-workflow.zh-CN-desc" id="agent-workflow-zh-CN-root"><title id="agent-workflow.zh-CN-title">先有证据，再起草；通过核验，才接受</title><desc id="agent-workflow.zh-CN-desc">本图展示简历评审；求职信和职业对话使用各自的校验规则。</desc><defs>
