}</style><marker id="agent-workflow-zh-CN-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#65717c"/></marker><marker id="agent-workflow-zh-CN-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#08708a"/></marker><marker id="agent-workflow-zh-CN-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3867d6"/></marker></defs><rect width="1280" height="720" fill="#f6f8fb"/><text x="40" y="56" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="28" font-weight="600" fill="#182026">先有证据，再起草；通过核验，才接受</text><text x="40" y="84" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="400" fill="#65717c">本图展示简历评审；求职信和职业对话使用各自的校验规则。</text><path d="M280 192 H432" fill="none" stroke="#65717c" stroke-width="1.5" marker-end="url(#agent-workflow-zh-CN-arrow)"/><path d="M280 448 H344 Q352 448 352 440 V232 Q352 224 360 224 H432" fill="none" stroke="#65717c" stroke-width="1.5" marker-end="url(#agent-workflow-zh-CN-arrow)"/><path d="M592 240 V304" fill="none" stroke="#65717c" stroke-width="1.5" marker-end="url(#agent-workflow-zh-CN-arrow)"/><path d="M592 400 V464" fill="none" stroke="#65717c" stroke-width="1.5" marker-end="url(#agent-workflow-zh-CN-arrow)"/><path d="M752 352 H1000" fill="none" stroke="#65717c" stroke-width="1.5" marker-end="url(#agent-workflow-zh-CN-arrow)" stroke-dasharray="5,4"/><path d="M752 496 H904 Q912 496 912 488 V376 Q912 368 920 368 H1000" fill="none" stroke="#65717c" stroke-width="1.5" marker-end="url(#agent-workflow-zh-CN-arrow)" stroke-dasharray="5,4"/><path d="M1120 304 V112 Q1120 104 1112 104 H600 Q592 104 592 112 V144" fill="none" stroke="#65717c" stroke-width="1.5" marker-end="url(#agent-workflow-zh-CN-arrow)" stroke-dasharray="5,4"/><path d="M752 528 H1000" fill="none" stroke="#65717c" stroke-width="1.5" marker-end="url(#agent-workflow-zh-CN-arrow)"/><rect x="824" y="328" width="104" height="16" fill="#f6f8fb"/><text text-anchor="middle" x="876.0" y="339" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">失败后修订</text><rect x="920" y="424" width="64" height="16" fill="#f6f8fb"/><text text-anchor="middle" x="952.0" y="435" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">失败</text><rect x="832" y="504" width="88" height="16" fill="#f6f8fb"/><text text-anchor="middle" x="876.0" y="515" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">通过</text><rect x="40" y="144" width="240" height="96" rx="6" fill="#ffffff" stroke="#cbd2d9"/><text x="56" y="168" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">INPUT</text><text x="56" y="192" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#182026">档案证据与职位描述</text><text x="56" y="212" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">引用档案事实；职位文本不可信</text><rect x="40" y="400" width="240" height="96" rx="6" fill="#ffffff" stroke="#cbd2d9"/><text x="56" y="424" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">REGISTRY</text><text x="56" y="448" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#182026">已验证的技能文件</text><text x="56" y="468" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">skills-lock.json / SHA-256</text><text x="56" y="484" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">单个能力，路径限制在根目录内</text><rect x="432" y="144" width="320" height="96" rx="6" fill="#ffffff" stroke="#cbd2d9"/><text x="448" y="168" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">AGENT</text><text x="448" y="192" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#182026">写作与修订草稿</text><text x="448" y="212" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">使用限定范围的事实与任务技能</text><rect x="432" y="304" width="320" height="96" rx="6" fill="#e6f7fa" stroke="#08708a"/><text x="448" y="328" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">IN PROCESS</text><text x="448" y="352" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#182026">程序校验</text><text x="448" y="372" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">provenance / skill-naming / numeric-evidence</text><rect x="432" y="464" width="320" height="96" rx="6" fill="#e6f7fa" stroke="#08708a"/><text x="448" y="488" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">MODEL REVIEW</text><text x="448" y="512" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#182026">事实核验与建议类评审</text><text x="448" y="532" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">事实核验失败即拦截，评分不能抵消</text><rect x="1000" y="304" width="240" height="96" rx="6" fill="#ffffff" stroke="#cbd2d9"/><text x="1016" y="328" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">AGENT</text><text x="1016" y="352" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#182026">有限次修订</text><text x="1016" y="372" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">受质量轮次与重试预算限制</text><rect x="1000" y="464" width="240" height="96" rx="6" fill="#eef4f7" stroke="#cbd2d9"/><text x="1016" y="488" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">ARTIFACT</text><text x="1016" y="512" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#182026">已通过版本与 PDF</text><text x="1016" y="532" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">渲染与附件选择分别执行</text><text x="432" y="608" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="400" fill="#65717c">内部未通过的尝试仍保留历史；外部提交只保存通过评审的草稿。</text><line x1="40" y1="664" x2="1240" y2="664" stroke="#cbd2d9"/><text x="40" y="692" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">实线：进入下一项检查</text><text x="376" y="692" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#08708a">青色：通过条件</text><text x="784" y="692" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">虚线：有限次修订</text></svg>
