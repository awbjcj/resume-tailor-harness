800 512 H888 Q896 512 896 520 V584 Q896 592 904 592 H1000" fill="none" stroke="#65717c" stroke-width="1.5" marker-end="url(#system-architecture-zh-CN-arrow)"/><rect x="648" y="332" width="88" height="16" fill="#f6f8fb"/><text text-anchor="middle" x="692.0" y="343" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">任务调度</text><rect x="40" y="160" width="240" height="96" rx="6" fill="#ffffff" stroke="#cbd2d9"/><text x="56" y="184" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">CLIENT</text><text x="56" y="208" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#182026">网页应用 / Python SDK</text><text x="56" y="228" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">React / TypeScript / HTTP</text><text x="56" y="244" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">操作、查询与运行进度</text><rect x="40" y="448" width="240" height="96" rx="6" fill="#ffffff" stroke="#cbd2d9"/><text x="56" y="472" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">LOCAL PROCESS</text><text x="56" y="496" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#182026">独立命令行</text><text x="56" y="516" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">Python / Typer</text><text x="56" y="532" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">直接调用共享业务服务</text><rect x="480" y="160" width="320" height="128" rx="6" fill="#e6f7fa" stroke="#08708a"/><text x="496" y="184" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">RUNTIME</text