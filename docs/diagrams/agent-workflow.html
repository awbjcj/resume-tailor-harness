arker-end="url(#arrow)" stroke-dasharray="5,4"/><path d="M1120 304 V112 Q1120 104 1112 104 H600 Q592 104 592 112 V144" fill="none" stroke="#65717c" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,4"/><path d="M752 528 H1000" fill="none" stroke="#65717c" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="824" y="328" width="104" height="16" fill="#f6f8fb"/><text text-anchor="middle" x="876.0" y="339" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">FAIL / REVISE</text><rect x="920" y="424" width="64" height="16" fill="#f6f8fb"/><text text-anchor="middle" x="952.0" y="435" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">FAIL</text><rect x="832" y="504" width="88" height="16" fill="#f6f8fb"/><text text-anchor="middle" x="876.0" y="515" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">PASS</text><rect x="40" y="144" width="240" height="96" rx="6" fill="#ffffff" stroke="#cbd2d9"/><text x="56" y="168" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">INPUT</text><text x="56" y="192" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#182026">Profile evidence + JD</text><text x="56" y="212" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">Cited facts; JD is untrusted input</text><rect x="40" y="400" width="240" height="96" rx="6" fill="#ffffff" stroke="#cbd2d9"/><text x="56" y="424" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">REGISTRY</text><text x="56" y="448" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#182026">Verified skill procedure</text><text x="56" y="468" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">skills-lock.json / SHA-256</text><text x="56" y="484" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">One capability; confined path</text><rect x="432" y="144" width="320" height="96" rx="6" fill="#ffffff" stroke="#cbd2d9"/><text x="448" y="168" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">AGENT</text><text x="448" y="192" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#182026">Writer / revised draft</text><text x="448" y="212" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">Scoped facts and one task procedure</text><rect x="432" y="304" width="320" height="96" rx="6" fill="#e6f7fa" stroke="#08708a"/><text x="448" y="328" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">IN PROCESS</text><text x="448" y="352" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#182026">Deterministic gates</text><text x="448" y="372" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">provenance / skill-naming / numeric-evidence</text><rect x="432" y="464" width="320" height="96" rx="6" fill="#e6f7fa" stroke="#08708a"/><text x="448" y="488" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">MODEL REVIEW</text><text x="448" y="512" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#182026">Fact-check + advisory panel</text><text x="448" y="532" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">Fact-check blocks; scores cannot override</text><rect x="1000" y="304" width="240" height="96" rx="6" fill="#ffffff" stroke="#cbd2d9"/><text x="1016" y="328" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">AGENT</text><text x="1016" y="352" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#182026">Bounded revision</text><text x="1016" y="372" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">Round and retry budgets apply</text><rect x="1000" y="464" width="240" height="96" rx="6" fill="#eef4f7" stroke="#cbd2d9"/><text x="1016" y="488" font-family="'Geist Mono', 'Microsoft YaHei', monospace" font-size="8" font-weight="400" fill="#65717c">ARTIFACT</text><text x="1016" y="512" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#182026">Accepted version / PDF</text><text x="1016" y="532" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">Render and select separately</text><text x="432" y="608" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="400" fill="#65717c">Rejected internal attempts remain in history; external submission saves only accepted drafts.</text><line x1="40" y1="664" x2="1240" y2="664" stroke="#cbd2d9"/><text x="40" y="692" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">Solid: next check</text><text x="376" y="692" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#08708a">Teal: acceptance checks</text><text x="784" y="692" font-family="'Geist', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="9" font-weight="400" fill="#65717c">Dashed: bounded revision</text></svg></div>
<p>Simplified review flow: verdict aggregation also applies configured score thresholds. A retry is bounded and does not promise eventual approval. Cover letters use provenance checks without this panel; Career Lab stays draft-only.</p></main></body></html>
