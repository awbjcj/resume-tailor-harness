<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="system-context-title system-context-desc">
<title id="system-context-title">The product and its surroundings</title>
<desc id="system-context-desc">A job seeker operates Résumé Tailor Harness. The system reads GitHub evidence, fetches job postings, calls model providers, and optionally connects to Gmail.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<path d="M0 0 L8 3 L0 6Z" fill="#4f5d75"/>
</marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<path d="M0 0 L8 3 L0 6Z" fill="#eb6c36"/>
</marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<path d="M0 0 L8 3 L0 6Z" fill="#2e5aa8"/>
</marker>
</defs>
<rect width="960" height="600" fill="#f5f5f5"/>
<text x="40" y="38" font-family="'Geist Mono', Consolas, monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="start">C4 LEVEL 1 / SYSTEM CONTEXT</text>
<text x="40" y="76" font-family="'Instrument Serif', Georgia, serif" font-size="28" fill="#2d3142">The product and its surroundings</text>
<path d="M240 296 H344" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="265.6" y="270" width="52.8" height="14" rx="2" fill="#f5f5f5"/>
<text x="292" y="280" font-family="'Geist Mono', Consolas, monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">OPERATES</text>
