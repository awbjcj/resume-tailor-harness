<rect x="620.85" y="270" width="78.3" height="14" rx="2" fill="#f5f5f5"/>
<text x="660" y="280" font-family="'Geist Mono', Consolas, monospace" font-size="8" font-weight="400" fill="#2e5aa8" text-anchor="middle">CALLS · HTTPS</text>
<path d="M600 344 H648 Q656 344 656 352 V440 Q656 448 664 448 H720" fill="none" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
<rect x="568.85" y="402" width="78.3" height="14" rx="2" fill="#f5f5f5"/>
<text x="608" y="412" font-family="'Geist Mono', Consolas, monospace" font-size="8" font-weight="400" fill="#2e5aa8" text-anchor="middle">SYNCS · OAUTH</text>
<g data-node="Job seeker">
<rect x="40" y="240" width="200" height="112" rx="6" fill="#e7ebef" stroke="#4f5d75"/>
<text x="56" y="260" font-family="'Geist Mono', Consolas, monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="start">PERSON</text>
<text x="56" y="284" font-family="'Geist', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="start">Job seeker</text>
<text x="56" y="305" font-family="'Geist', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#4f5d75" text-anchor="start">Approves target jobs</text>
<text x="56" y="322" font-family="'Geist', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#4f5d75" text-anchor="start">Reviews documents</text>
<text x="56" y="339" font-family="'Geist', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#4f5d75" text-anchor="start">Tracks applications</text>
</g>
<g data-node="Résumé Tailor Harness">
<rect x="344" y="224" width="256" height="144" rx="6" fill="#fcf0e9" stroke="#eb6c36"/>
<text x="360" y="244" font-family="'Geist Mono', Consolas, monospace" font-size="8" font-weight="400" fill="#eb6c36" text-anchor="start">SOFTWARE SYSTEM</text>
<text x="360" y="268" font-family="'Geist', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="start">Résumé Tailor Harness</text>
<text x="360" y="289" font-family="'Geist', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#4f5d75" text-anchor="start">Builds an evidence profile</text>
<text x="360" y="306" font-family="'Geist', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#4f5d75" text-anchor="start">Finds and scores jobs</text>
<text x="360" y="323" font-family="'Geist', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#4f5d75" text-anchor="start">Tailors documents; tracks outcomes</text>
</g>
<g data-node="GitHub">
<rect x="344" y="104" width="256" height="56" rx="6" fill="#eceef0" stroke="#9ba2ad"/>
<text x="360" y="124" font-family="'Geist Mono', Consolas, monospace" font-size="8" font-weight="400" fill="#9ba2ad" text-anchor="start">EXTERNAL SYSTEM</text>
<text x="360" y="148" font-family="'Geist', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="start">GitHub</text>
</g>
<g data-node="Job sources">
<rect x="720" y="112" width="200" height="96" rx="6" fill="#eceef0" stroke="#9ba2ad"/>
<text x="736" y="132" font-family="'Geist Mono', Consolas, monospace" font-size="8" font-weight="400" fill="#9ba2ad" text-anchor="start">EXTERNAL SYSTEMS</text>
<text x="736" y="156" font-family="'Geist', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="start">Job sources</text>
<text x="736" y="177" font-family="'Geist', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#4f5d75" text-anchor="start">Job boards, company sites</text>
<text x="736" y="194" font-family="'Geist', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#4f5d75" text-anchor="start">Postings and descriptions</text>
</g>
<g data-node="Model providers">
<rect x="720" y="248" width="200" height="96" rx="6" fill="#eceef0" stroke="#9ba2ad"/>
<text x="736" y="268" font-family="'Geist Mono', Consolas, monospace" font-size="8" font-weight="400" fill="#9ba2ad" text-anchor="start">EXTERNAL SYSTEMS</text>
<text x="736" y="292" font-family="'Geist', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="start">Model providers</text>
<text x="736" y="313" font-family="'Geist', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#4f5d75" text-anchor="start">Drafting, extraction, review</text>
<text x="736" y="330" font-family="'Geist', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#4f5d75" text-anchor="start">Configured per model tier</text>
</g>
<g data-node="Gmail">
<rect x="720" y="400" width="200" height="96" rx="6" fill="#eceef0" stroke="#9ba2ad"/>
<text x="736" y="420" font-family="'Geist Mono', Consolas, monospace" font-size="8" font-weight="400" fill="#9ba2ad" text-anchor="start">EXTERNAL SYSTEM · OPTIONAL</text>
<text x="736" y="444" font-family="'Geist', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#2d3142" text-anchor="start">Gmail</text>
<text x="736" y="465" font-family="'Geist', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#4f5d75" text-anchor="start">Status signals and drafts</text>
<text x="736" y="482" font-family="'Geist', 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#4f5d75" text-anchor="start">Connected by the user</text>
</g>
<path d="M40 552 H920" stroke="#bfc0c0"/>
<text x="40" y="574" font-family="'Geist', 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#4f5d75" text-anchor="start">Orange: system in scope   ·   Gray: people and external systems   ·   Arrows: initiating interaction</text>
</svg>
