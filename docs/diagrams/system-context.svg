<rect x="480.85" y="190" width="78.3" height="14" rx="2" fill="#f5f5f5"/>
<text x="520" y="200" font-family="'Geist Mono', Consolas, monospace" font-size="8" font-weight="400" fill="#4f5d75" text-anchor="middle">READS · HTTPS</text>
<path d="M600 248 H648 Q656 248 656 240 V168 Q656 160 664 160 H720" fill="none" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
<rect x="615.75" y="134" width="88.5" height="14" rx="2" fill="#f5f5f5"/>
<text x="660" y="144" font-family="'Geist Mono', Consolas, monospace" font-size="8" font-weight="400" fill="#2e5aa8" text-anchor="middle">FETCHES · HTTPS</text>
