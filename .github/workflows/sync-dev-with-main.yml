name: Sync dev with main

# main only receives rebase-merges (see CLAUDE.md > Branching), which replay
# each commit with a fresh SHA onto main's tip without touching the source
# branch. After a normal dev -> main promotion, dev and main hold identical
# content under different commit hashes. This job joins those histories with an
# empty merge commit whenever their trees already match. The update remains a
# normal fast-forward of dev, so it respects the branch's no-force-push rule.
#
# It is deliberately conservative: if dev's tree differs from the new main
# (e.g. someone pushed new work to dev in the window between the promotion
# PR merging and this job running, or a hotfix/* branch just landed on main
# without dev having it yet), it does nothing and leaves a note in the job
# summary instead of forcing anything. A hotfix still needs its documented
# manual merge back into dev.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-dev:
    name: sync-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge main into dev if content already matches
        run: |
          git fetch origin dev main
          dev_sha="$(git rev-parse origin/dev)"
          main_sha="$(git rev-parse origin/main)"
          if git diff --quiet origin/dev origin/main; then
            if [ "$dev_sha" = "$main_sha" ]; then
              echo "dev is already at main's tip; nothing to do." >>"$GITHUB_STEP_SUMMARY"
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git checkout --detach "$dev_sha"
              git merge --no-ff --no-edit "$main_sha" -m "chore: sync main into dev after promotion"
              # This is a normal fast-forward of dev. If dev changed after the
              # fetch, the remote rejects the push instead of losing that work.
              git push origin "HEAD:refs/heads/dev"
              echo "Merged main ($main_sha) into dev." >>"$GITHUB_STEP_SUMMARY"
            fi
          else
            {
              echo "dev and main have diverged content, so dev was NOT touched."
              echo "This is expected right after a hotfix/* merge (dev doesn't"
              echo "have the hotfix yet) or if new commits landed on dev while"
              echo "the promotion PR was merging. Merge main back into dev to"
              echo "reconcile."
            } >>"$GITHUB_STEP_SUMMARY"
          fi
