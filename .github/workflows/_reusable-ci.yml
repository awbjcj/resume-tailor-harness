name: Reusable CI

on:
  workflow_call:
    inputs:
      full:
        description: >
          Run the full suite (web production build + dependency audit) in
          addition to lint/test. Reduced runs pass false; full runs pass true.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python-quality:
    name: python-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check src tests evals sdk/python/src
      - name: Type check (Pyright / Pylance)
        run: uv run pyright
      - name: Test (pytest, offline)
        run: uv run pytest tests

  web-quality:
    name: web-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Test (vitest)
        run: npm run test:run
      - name: Build
        if: inputs.full
        run: npm run build

  security-audit:
    name: security-audit
    if: inputs.full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Export locked Python dependencies
        run: uv export --frozen --no-emit-project --format requirements-txt --output-file requirements-audit.txt > /dev/null
      - name: Python dependency audit
        run: uvx pip-audit --requirement requirements-audit.txt --require-hashes --disable-pip --strict
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Web dependency audit
        working-directory: web
        run: npm audit --audit-level=high
