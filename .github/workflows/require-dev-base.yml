name: Require dev or hotfix as PR source

# main only accepts merges from dev, or from a hotfix/* branch for urgent
# out-of-band fixes (see CLAUDE.md > Branching). This check fails any pull
# request into main whose head branch isn't dev or hotfix/*, so it can be
# marked as a required status check in main's branch protection alongside
# the ci-main.yml checks.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  require-dev-base:
    name: require-dev-base
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source branch is dev or hotfix/*
        run: |
          if [ "${{ github.head_ref }}" != "dev" ] && [[ "${{ github.head_ref }}" != hotfix/* ]]; then
            echo "::error::Pull requests into main must come from the 'dev' branch or a 'hotfix/*' branch (got '${{ github.head_ref }}')."
            exit 1
          fi
