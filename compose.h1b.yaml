# Optional local historical H-1B service.  This file is deliberately separate
# from compose.yaml: the default app stays lightweight, while callers that opt
# in must enable the named profile below.
services:
  resume-tailor-harness:
    profiles:
      - h1b
    environment:
      # These override an .env file only for the optional local stack.  The
      # service is reached on Docker's private network; it is never published
      # to the host.
      H1B_MCP_ENABLED: "true"
      H1B_MCP_TRANSPORT: streamable-http
      H1B_MCP_COMMAND: ""
      H1B_MCP_URL: http://h1b-job-search-mcp:8000/mcp
    depends_on:
      h1b-job-search-mcp:
        condition: service_healthy

  h1b-job-search-mcp:
    profiles:
      - h1b
    build:
      context: .
      dockerfile: Dockerfile.h1b
    image: ${H1B_JOB_SEARCH_MCP_IMAGE:-h1b-job-search-mcp:local}
    init: true
    restart: unless-stopped
    environment:
      H1B_HOST: 0.0.0.0
      H1B_PORT: 8000
    volumes:
      - h1b-job-search-mcp-data:/app/data_cache
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

volumes:
  h1b-job-search-mcp-data:
