services:
  resume-tailor-harness:
    build:
      context: .
    image: ${RESUME_TAILOR_HARNESS_IMAGE:-resume-tailor-harness:local}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RESUME_TAILOR_HARNESS_PORT:-8000}:8000"
    environment:
      APP_MODE: local
      PORT: 8000
    env_file:
      - path: .env
        required: false
    volumes:
      - resume-tailor-harness-data:/app/data

volumes:
  resume-tailor-harness-data:
