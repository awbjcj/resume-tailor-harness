[project]
name = "resume-tailor-harness"
version = "0.1.0"
description = "Personal AI job-hunt, resume-tailoring, and application-tracking pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agno[mcp]>=2.8.6,<3.1",
    "anthropic>=0.107.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.1.0",
    "openai>=1.0.0",
    # agno 2.6.x's Gemini Interactions import expects the `step_delta` submodule,
    # which google-genai renamed to `stepdelta` in 2.9.0 — cap below it.
    "google-genai>=2.5.0,<2.23.0",
    "beautifulsoup4>=4.15.0",
    "google-api-python-client>=2.197.0",
    "google-auth>=2.53.0",
    "google-auth-oauthlib>=1.4.0",
    "httpx>=0.28.1",
    "playwright>=1.60.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "email-validator>=2.2.0",
    "filelock>=3.20.0,<4",
    "pypdf>=6.15.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.38",
    "textual>=8.2.7",
    "typer>=0.26.7",
    "typst>=0.14.9",
    "markdownify>=0.13.0",
    "ddgs>=9.14.4",
    "tldextract>=5.3.0",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.6",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "ruff>=0.15.18,<0.17.0",
]

[project.scripts]
resume-tailor-harness = "resume_tailor_harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_tailor_harness"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff.lint]
# Ruff 0.16 expanded its implicit default from 59 to 413 rules. Keep the
# repository's established lint contract explicit so tool upgrades do not
# silently turn on unrelated rule families across the entire codebase.
select = ["E4", "E7", "E9", "F"]
